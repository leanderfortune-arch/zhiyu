name: zhiyu
services:
  web:
    build:
      context: ../..
      dockerfile: deploy/zhiyu/Dockerfile
      args:
        VCS_REF: "${ZHIYU_REVISION:-unknown}"
    image: zhiyu-web:local
    restart: unless-stopped
    init: true
    environment:
      ZHIYU_ORIGIN: http://100.78.177.33:8091
      ZHIYU_AI_PROXY: http://host.docker.internal:7897
      ZHIYU_AI_NO_PROXY: localhost,127.0.0.1,[::1],host.docker.internal,100.78.177.33
    ports:
      - "100.78.177.33:8091:8091"
    volumes:
      - /opt/zhiyu/data:/data
      - /opt/zhiyu/backups:/backups
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=256m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 2g
    cpus: 2
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "require('http').get('http://127.0.0.1:8091/api/health',{headers:{Host:'100.78.177.33:8091'}},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
