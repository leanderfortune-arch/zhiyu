name: zhiyu
services:
  web:
    build:
      context: ../..
      dockerfile: deploy/zhiyu/Dockerfile
      args:
        VCS_REF: "${ZHIYU_REVISION:-unknown}"
    image: zhiyu-web:local
    restart: unless-stopped
    init: true
    environment:
      ZHIYU_ORIGIN: https://100.78.177.33:8443
      ZHIYU_TLS_CERT: /run/tls/cert.pem
      ZHIYU_TLS_KEY: /run/tls/key.pem
    ports:
      - "100.78.177.33:8443:8091"
    volumes:
      - /opt/zhiyu/data:/data
      - /opt/zhiyu/backups:/backups
      - /opt/zhiyu/tls:/run/tls:ro
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=256m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 2g
    cpus: 2
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "require('https').get('https://127.0.0.1:8091/api/health',{rejectUnauthorized:false,headers:{Host:'100.78.177.33:8443'}},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
